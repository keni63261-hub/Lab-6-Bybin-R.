<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Классификатор ирисов</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Введите параметры цветка</h2>
    <form method="post">
        <div class="form-group">
            <label>Длина чашелистика (см):</label>
            <input type="number" step="0.1" name="sepal_length" required value="{{ sepal_length or '' }}">
        </div>
        <div class="form-group">
            <label>Ширина чашелистика (см):</label>
            <input type="number" step="0.1" name="sepal_width" required value="{{ sepal_width or '' }}">
        </div>
        <div class="form-group">
            <label>Длина лепестка (см):</label>
            <input type="number" step="0.1" name="petal_length" required value="{{ petal_length or '' }}">
        </div>
        <div class="form-group">
            <label>Ширина лепестка (см):</label>
            <input type="number" step="0.1" name="petal_width" required value="{{ petal_width or '' }}">
        </div>
        <button type="submit">Отправить</button>
    </form>

    {% if prediction %}
    <div class="result">
        <strong>Результат:</strong> {{ prediction }}
    </div>
    {% endif %}

    {% if error %}
    <div class="result error">
        <strong>Ошибка:</strong> {{ error }}
    </div>
    {% endif %}
</body>
</html>
